<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ac2ff" />
      <stop offset="100%" stop-color="#127ce5" />
    </linearGradient>

    <!-- Clip path to keep internal clouds contained within the letter S -->
    <clipPath id="sIslandClip">
      <path d="M 160 96 H 352 V 160 H 224 V 208 H 352 V 384 H 160 V 320 H 288 V 272 H 160 Z" />
    </clipPath>
  </defs>

  <!-- Dark Outer Container Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="#1b2028" stroke="#52ccff" stroke-width="8" />

  <!-- Inner Sky Canvas -->
  <rect x="40" y="40" width="432" height="432" rx="84" ry="84" fill="url(#skyGrad1)" />

  <!-- Ambient Sky Pixel Clouds (Background) -->
  <path d="M 64 80 h 80 v 16 h -80 z" fill="#ffffff" opacity="0.6" />
  <path d="M 330 64 h 96 v 20 h -96 z" fill="#ffffff" opacity="0.6" />
  <path d="M 64 400 h 96 v 16 h -96 z" fill="#ffffff" opacity="0.5" />
  <path d="M 320 420 h 80 v 16 h -80 z" fill="#ffffff" opacity="0.6" />

  <!-- Main Letter "S" Island Structure -->
  <!-- Dark Pixel Drop Shadow / Contour -->
  <path d="M 152 88 H 360 V 168 H 232 V 200 H 360 V 392 H 152 V 312 H 280 V 280 H 152 Z" fill="#0d131a" />

  <!-- Letter S Body with Sky & Cloud Texture Inside -->
  <g clip-path="url(#sIslandClip)">
    <rect x="0" y="0" width="512" height="512" fill="#2d9bf0" />
    <!-- Pixel Cloud Clusters inside S -->
    <path d="M 160 112 h 120 v 16 h 48 v 24 h -168 z" fill="#ffffff" />
    <path d="M 200 128 h 90 v 12 h -90 z" fill="#e0f4ff" />
    <path d="M 220 220 h 110 v 16 h 20 v 32 h -130 z" fill="#ffffff" />
    <path d="M 160 336 h 160 v 24 h -160 z" fill="#ffffff" />
    <path d="M 190 320 h 100 v 16 h -100 z" fill="#e0f4ff" />
  </g>

  <!-- Overlapping Cloud Badges on top of the S (Creates 3D depth) -->
  <path d="M 300 144 h 64 v 16 h 16 v 16 h -80 z" fill="#ffffff" />
  <path d="M 128 256 h 80 v 16 h 16 v 16 h -96 z" fill="#ffffff" />
  
  <!-- Outer Light Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.2" />
</svg>
